name: Measure WordPress PHP 8.1 floor

on:
  push:
    branches:
      - ci/5-wordpress-floor

permissions:
  contents: read

jobs:
  core:
    name: WordPress ${{ matrix.wordpress }} / PHP 8.1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['5.5', '5.6', '5.7', '5.8', '5.9', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: tny_floor
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-only"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
          extensions: mysqli
          tools: wp-cli:2.12.0
      - name: Bootstrap exact WordPress core
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wordpress"
          wp core download --version="$WORDPRESS_VERSION" --path="$root"
          if [[ "$WORDPRESS_VERSION" != latest ]]; then
            wp core verify-checksums --version="$WORDPRESS_VERSION" --path="$root"
          fi
          wp config create --path="$root" --dbname=tny_floor --dbuser=root --dbpass=integration-only --dbhost=127.0.0.1:3306 --dbprefix=tny_floor_ --skip-check
          wp core install --path="$root" --url=http://tny-floor.test --title=Floor --admin_user=integration --admin_password=integration-only --admin_email=integration@example.test --skip-email
          wp eval 'echo "BOOTSTRAPPED ", get_bloginfo("version"), " PHP ", PHP_VERSION, "\n";' --path="$root"
