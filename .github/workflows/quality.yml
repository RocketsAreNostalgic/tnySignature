name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  baseline:
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-wordpress-plugin.yml@72a90b5826db37d1e94cdcdcf3374ccf58c0aa7d
    with:
      php-version: '8.1'
      pnpm-version: '11.13.1'

  quality:
    name: quality
    if: ${{ always() }}
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - name: Require shared WordPress quality baseline
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
        run: test "$BASELINE_RESULT" = success
