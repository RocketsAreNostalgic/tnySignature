name: Stage verified integration lock

on:
  push:
    branches: [ci/5-integration-tools]

permissions: {}

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: RocketsAreNostalgic/tnySignature
          run-id: 35866496837
          artifact-ids: '10752314763'
          merge-multiple: true
          path: ${{ runner.temp }}/verified-pair
      - name: Import only the independently verified bytes as unreferenced Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          PAIR: ${{ runner.temp }}/verified-pair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          expected = {
              'composer.json': ('c73519fbdb6a1d454b72bedc53dd5eb9ab40bddec4b696b47ff9a5437eb45cfc', '3230e735ae21e553a0ab2159807c5e146994d296'),
              'composer.lock': ('da709465d00aef9dc36ff032b547337dcad3a1a292e2a2cf33915d0b31b0bebb', '52983676306425e891cdf13819e8ec0eec71b81f'),
          }
          for name, (digest, blob) in expected.items():
              content = (Path(os.environ['PAIR']) / name).read_bytes()
              if hashlib.sha256(content).hexdigest() != digest:
                  raise SystemExit('Artifact bytes do not match reviewed pair: ' + name)
              payload = json.dumps({'encoding': 'utf-8', 'content': content.decode()}).encode()
              result = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/RocketsAreNostalgic/tnySignature/git/blobs', '--input', '-'], input=payload))
              if result['sha'] != blob:
                  raise SystemExit('Unexpected Git blob identity: ' + name)
              print(name, result['sha'])
          PY
