name: Materialize quality formatting

on:
  push:
    branches:
      - chore/refresh-quality-foundation

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out migration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/refresh-quality-foundation
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: '11.13.1'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize canonical source formatting
        run: |
          set -euo pipefail
          pnpm format
          pnpm exec eslint --fix "assets/src/**/*.js" vite.config.js "tests/quality/**/*.mjs"
          pnpm exec stylelint --fix "assets/src/**/*.{css,scss}"
          pnpm format

      - name: Rebuild committed assets
        run: pnpm build

      - name: Verify refreshed frontend checks
        run: |
          set -euo pipefail
          pnpm lint:js
          pnpm lint:css
          pnpm format:check

      - name: Commit formatting and generated assets only
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(assets/src/|assets/dist/|vite\.config\.js$|eslint\.config\.mjs$|stylelint\.config\.cjs$|prettier\.config\.cjs$|tests/quality/|package\.json$|pnpm-workspace\.yaml$)' || true)"
          test -z "$unexpected"
          git add assets/src assets/dist vite.config.js eslint.config.mjs stylelint.config.cjs prettier.config.cjs tests/quality package.json pnpm-workspace.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: materialize refreshed quality baseline'
          git push origin HEAD:chore/refresh-quality-foundation
