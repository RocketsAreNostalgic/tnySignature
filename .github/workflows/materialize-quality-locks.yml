name: Materialize quality locks

on:
  push:
    branches:
      - chore/refresh-quality-foundation

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out migration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/refresh-quality-foundation
          fetch-depth: 0

      - name: Set up PHP floor
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Refresh Composer lock at the runtime floor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          composer config --global github-oauth.github.com "$GH_TOKEN"
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
          composer validate --strict --no-check-publish --no-check-all
          composer install --no-interaction --prefer-dist --no-progress

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: '11.13.1'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Refresh pnpm lock
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          test "$(pnpm --version)" = '11.13.1'

      - name: Commit lockfile changes only
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(composer\.lock|pnpm-lock\.yaml)$' || true)"
          test -z "$unexpected"
          git add composer.lock pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh locked quality toolchains'
          git push origin HEAD:chore/refresh-quality-foundation
