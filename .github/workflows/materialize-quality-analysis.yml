name: Materialize quality analysis lock

on:
  push:
    branches:
      - quality/4-static-analysis

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - name: Add locked WordPress-aware PHPStan toolchain
        run: |
          set -euo pipefail
          composer require --dev --with-all-dependencies \
            phpstan/phpstan:^2.1 \
            szepeviktor/phpstan-wordpress:^2.0
          composer validate --strict
          git diff --check
      - name: Commit exact lock update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock
          git diff --cached --quiet && exit 0
          git commit -m 'chore(quality): lock WordPress-aware PHPStan'
          git push origin HEAD:quality/4-static-analysis
